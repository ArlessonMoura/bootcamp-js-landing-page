<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04061a" />
    <title>Interesse recebido | Bootcamp Full Stack</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        color: #f6f8ff;
        background: #04061a;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background:
          radial-gradient(ellipse at top right, #29204d, transparent 55%), #04061a;
      }
      main {
        width: min(100%, 38rem);
        padding: 2.5rem;
        border: 1px solid rgba(53, 230, 255, 0.4);
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin-top: 0;
        color: #35e6ff;
        font-size: clamp(1.8rem, 8vw, 2.6rem);
      }
      p {
        color: #d4d9e8;
        line-height: 1.65;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        color: #04061a;
        font-weight: 700;
        text-decoration: none;
        padding: 0.8rem 1rem;
        border-radius: 0.7rem;
        background: #35e6ff;
      }
      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Recebemos seu interesse.</h1>
      <p>
        Obrigado por querer saber mais sobre o Bootcamp Full Stack. Em breve entraremos em
        contato pelo WhatsApp informado.
      </p>
      <a href="/">Voltar para o bootcamp</a>
    </main>
  </body>
</html>
